<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DotTTS">
  <!-- VoiceHub 自绘的标识：**三点**（DotTTS 之名）+ 一道基线——不是官方 logo 的复制品；
       要换成官方图标，直接替换本文件即可（插件按目录里的 icon.svg 取图）。
       配色取琥珀色，与 BreezeTTS 2（蓝）/ IndexTTS2（青）/ MiniMax（紫）/
       GPT-SoVITS（青绿）都不撞：左栏一眼要看得出是哪一台。 -->
  <rect width="32" height="32" rx="8" fill="#b45309"/>
  <g fill="#ffffff">
    <circle cx="8.6" cy="15.4" r="2.1" opacity=".72"/>
    <circle cx="16" cy="15.4" r="3.4"/>
    <circle cx="23.4" cy="15.4" r="2.1" opacity=".72"/>
  </g>
  <rect x="7" y="22.6" width="18" height="1.5" rx=".75" fill="#ffffff" opacity=".5"/>
</svg>
