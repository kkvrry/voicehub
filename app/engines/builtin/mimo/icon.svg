<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MiMo">
  <!-- VoiceHub 自绘的平台标识：声波 + 渐变方块。不是官方 logo 的复制品；
       要换成官方图标，直接替换本文件即可（插件按目录里的 icon.svg 取图）。
       配色刻意与 MiniMax（紫）/ BreezeTTS 2（蓝）/ GPT-SoVITS（青绿）都不同：
       左栏一眼要看得出是哪一台。小米的品牌色是橙，这里取它的渐变。 -->
  <defs>
    <linearGradient id="mimoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#mimoGrad)"/>
  <g fill="#ffffff">
    <rect x="6.4"  y="13" width="2.6" height="6"  rx="1.3" opacity=".85"/>
    <rect x="10.6" y="8.6" width="2.6" height="14.8" rx="1.3"/>
    <rect x="14.8" y="5.4" width="2.6" height="21.2" rx="1.3"/>
    <rect x="19.0" y="9.8" width="2.6" height="12.4" rx="1.3"/>
    <rect x="23.2" y="13.6" width="2.6" height="4.8" rx="1.3" opacity=".85"/>
  </g>
</svg>
