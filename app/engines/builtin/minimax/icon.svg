<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MiniMax">
  <!-- VoiceHub 自绘的平台标识：声波 + 渐变方块。不是官方 logo 的复制品；
       要换成官方图标，直接替换本文件即可（插件按目录里的 icon.svg 取图）。 -->
  <defs>
    <linearGradient id="mmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b4be1"/>
      <stop offset="100%" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#mmGrad)"/>
  <g fill="#ffffff">
    <rect x="7"  y="13" width="2.6" height="6"  rx="1.3" opacity=".85"/>
    <rect x="11.2" y="9"  width="2.6" height="14" rx="1.3"/>
    <rect x="15.4" y="6"  width="2.6" height="20" rx="1.3"/>
    <rect x="19.6" y="10" width="2.6" height="12" rx="1.3"/>
    <rect x="23.8" y="14" width="2.6" height="4"  rx="1.3" opacity=".85"/>
  </g>
</svg>
