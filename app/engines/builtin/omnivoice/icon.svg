<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OmniVoice">
  <!-- VoiceHub 自绘的标识：一颗声波外面套一圈经纬线（"多语言"）；
       不是官方 logo 的复制品。要换成官方图标，直接替换本文件即可。
       配色取深绿，与 IndexTTS2（青绿）/ BreezeTTS 2（蓝）/ CosyVoice3（靛蓝）/
       DotTTS（琥珀）/ VoxCPM2（深红）/ MiniMax（紫）都不撞。 -->
  <rect width="32" height="32" rx="8" fill="#15803d"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".55">
    <circle cx="16" cy="16" r="9.6"/>
    <ellipse cx="16" cy="16" rx="4.6" ry="9.6"/>
    <path d="M6.4 16h19.2"/>
  </g>
  <g fill="#ffffff">
    <rect x="12.2" y="13" width="2.2" height="6" rx="1.1"/>
    <rect x="15.9" y="10.8" width="2.2" height="10.4" rx="1.1"/>
    <rect x="19.6" y="13.6" width="2.2" height="4.8" rx="1.1"/>
  </g>
</svg>
